name: Test, build and publish FORMA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/benchmark/requirements.txt
      - run: npm run benchmark
      - run: python scripts/measure-compression.py
      - run: python -m pip install -r tests/pdf-benchmark/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python scripts/check-pdf-production.py
      - run: npm run build
      - run: npm run test:production
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Check whether the owner enabled Pages
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/pages --jq '.build_type' 2>/dev/null | grep -q '^workflow$'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build ready. Enable Settings > Pages > Source: GitHub Actions, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
